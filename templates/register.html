{% extends "base.html" %}
{% block title %}Create account — Meeting Log{% endblock %}
{% block auth_content %}
<div class="auth-screen">
  <div class="auth-card">
    <p class="auth-eyebrow">Meeting Log</p>
    <h1>Create your account</h1>
    <p class="auth-sub">Every partner meeting, in one place — just for you.</p>

    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6">

      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6">

      <button type="submit" class="btn-primary">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
